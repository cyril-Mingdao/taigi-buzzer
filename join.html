<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>學生模式</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💭</text></svg>">
<link rel="stylesheet" href="assets/app.css?v=25">
<link rel="stylesheet" href="assets/spell.css?v=25">
</head>
<body>
<main class="stu" id="main"><p class="muted center">載入中…</p></main>

<script type="module">
import {
  loadFirebase, authErrorText, showSetupNeeded, normalizeRoom, serverNow, esc, $, toast,
  DEPARTMENTS, OTHER_CLASS, DEFAULT_META, groupLabel, rankBuzzes,
  optionList, optionText, isChoice, isMulti, isSpell, choicePoints, roundPoints, leaderboard, CORRECT_PTS,
} from './assets/core.js?v=25';
import {
  INITIAL_ROWS, FINAL_TABS, TONES, GROUP_COLORS, initialCat, finalCat, toneFinal, encode, decode, spellText, spellParts,
} from './assets/spell.js?v=25';
import { sound } from './assets/sound.js?v=25';

const main = $('#main');
const params = new URL(location.href).searchParams;
// ?slot=2 讓同一台電腦可以開多個學生分頁測試（不同的匿名身分）
const slot = (params.get('slot') || '').replace(/\W/g, '').slice(0, 8);
const LS = `buzz.profile${slot ? `.${slot}` : ''}`;
const loadProfile = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } };
const saveProfile = (p) => { try { localStorage.setItem(LS, JSON.stringify(p)); } catch {} };

let rid = normalizeRoom(params.get('room'));
if (!rid) askRoom(); else boot();

function askRoom() {
  main.innerHTML = `
    <div class="card"><h2>加入搶答</h2>
      <form id="f"><label>房間碼<input id="code" maxlength="6" autocomplete="off" placeholder="例如 7K3QXA" style="text-transform:uppercase;letter-spacing:.2em"></label>
      <button class="btn btn-yellow big">進入</button></form></div>`;
  $('#f').onsubmit = (e) => {
    e.preventDefault();
    rid = normalizeRoom($('#code').value);
    if (rid.length !== 6) return toast('房間碼是 6 碼');
    history.replaceState(null, '', `?room=${rid}${slot ? `&slot=${slot}` : ''}`);
    boot();
  };
}

async function boot() {
  let fb;
  try {
    fb = await loadFirebase({ appName: `student${slot ? `-${slot}` : ''}` });
  } catch (e) {
    if (e.code === 'NO_CONFIG') return showSetupNeeded(main);
    throw e;
  }
  let user;
  try {
    user = fb.auth.currentUser || (await new Promise((res) => { const off = fb.onAuthStateChanged(fb.auth, (u) => { off(); res(u); }); }));
    if (!user || !user.isAnonymous) user = (await fb.signInAnonymously(fb.auth)).user;
  } catch (e) {
    main.innerHTML = `<div class="card center"><h2>無法連線</h2><p>${esc(authErrorText(e))}</p></div>`;
    return;
  }
  const uid = user.uid;
  const r = (p = '') => fb.ref(fb.db, `buzzRooms/${rid}${p}`);

  // 上線狀態：斷線時自動移除，老師端顯示灰卡
  fb.onValue(fb.ref(fb.db, '.info/connected'), (snap) => {
    if (snap.val() !== true) return;
    fb.onDisconnect(r(`/presence/${uid}`)).remove();
    fb.set(r(`/presence/${uid}`), true).catch(() => {});
  });

  let s = null;
  let editing = false;
  let pending = null;         // 剛按下、等資料庫回報的動作（避免畫面閃回）
  const prev = { state: null, round: null, answer: null, judged: null };

  fb.onValue(r(), (snap) => {
    const v = snap.val();
    if (!v || !v.meta) {
      main.innerHTML = s
        ? '<div class="card center"><h2>本次搶答已結束</h2><p>謝謝參與！</p></div>'
        : `<div class="card center"><h2>找不到房間 ${esc(rid)}</h2><p>請確認大螢幕上的房間碼。</p><a class="btn btn-yellow" href="join.html">重新輸入</a></div>`;
      s = null;
      return;
    }
    const meta = { ...DEFAULT_META, ...v.meta };
    const players = v.players || {};
    s = {
      meta, players, me: players[uid] || null,
      kicked: !!(v.kicked || {})[uid],
      buzz: ((v.buzzes || {})[meta.round] || {})[uid] || null,
      foul: ((v.fouls || {})[meta.round] || {})[uid] || null,
      answer: ((v.answers || {})[meta.round] || {})[uid] || null,
      roundAnswers: (v.answers || {})[meta.round] || {},
      judge: ((v.judges || {})[meta.round] || {})[uid] || null,
      ranked: rankBuzzes((v.buzzes || {})[meta.round], players, meta),
    };
    if (prev.round !== meta.round) pending = null;
    effects();
    render();
  }, (e) => { main.innerHTML = `<div class="card center"><h2>無法讀取房間</h2><p>${esc(authErrorText(e))}</p></div>`; });

  setInterval(() => { if (s && s.foul && !isChoice(s.meta)) render(); }, 250);

  function effects() {
    const m = s.meta;
    if (prev.state !== null && m.state === 'open' && (prev.state !== 'open' || prev.round !== m.round)) {
      sound.open();
      navigator.vibrate && navigator.vibrate(120);
    }
    if (m.answer && m.answer !== prev.answer && s.answer) (s.answer.c === m.answer ? sound.first : sound.end)();
    if (s.judge && s.judge !== prev.judged) (s.judge === 'right' ? sound.first : sound.end)();
    prev.state = m.state; prev.round = m.round; prev.answer = m.answer || null; prev.judged = s.judge;
  }

  /* ── 畫面 ── */
  function render() {
    spUsed = false;
    renderMain();
    if (!spUsed) spClose();
  }
  function renderMain() {
    if (!s) return;
    // 只有遊戲中的按鈕畫面用 main._html 快取比對；其他畫面切回來時要清掉
    if (!(s.me && s.me.approved && s.meta.phase === 'game' && !editing && !s.kicked
      && (s.meta.groupMode === 'none' || s.me.group))) main._html = null;
    if (s.kicked) { main.innerHTML = '<div class="card center"><h2>你已被老師移出這個房間</h2></div>'; return; }
    // 老師中途改成分組模式時，還沒有組別的人要先補選組別
    if (!s.me || editing || (s.meta.groupMode !== 'none' && !s.me.group)) return renderForm();
    if (!s.me.approved) return renderPending();
    renderPlay();
  }

  function classOptions(cur) {
    return `<option value="">請選擇</option>${DEPARTMENTS.map((d) => `<optgroup label="${d.name}">${d.classes
      .map((c) => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('')}</optgroup>`).join('')}
      <option value="${OTHER_CLASS}" ${cur === OTHER_CLASS ? 'selected' : ''}>其他（非本校／不分班）</option>`;
  }

  function renderForm() {
    if (document.activeElement && main.contains(document.activeElement) && $('#jf')) return; // 填寫中不重繪
    const m = s.meta;
    const p = s.me || loadProfile();
    const takenGroups = new Set(Object.entries(s.players).filter(([u, q]) => u !== uid && q.approved && q.group).map(([, q]) => q.group));
    const groupSel = m.groupMode === 'none' ? '' : `
      <label>組別<select id="grp" required><option value="">請選擇</option>${Array.from({ length: m.groupCount }, (_, i) => i + 1)
        .map((g) => {
          const full = m.groupMode === 'single' && takenGroups.has(g);
          return `<option value="${g}" ${p.group === g ? 'selected' : ''} ${full ? 'disabled' : ''}>${groupLabel(g)}${full ? '（已有人）' : ''}</option>`;
        }).join('')}</select></label>`;
    main.innerHTML = `
      <div class="card">
        <h2>加入搶答 <small class="muted">${m.className ? `${esc(m.className)}・` : ''}${rid}</small></h2>
        <form id="jf">
          <label>班級<select id="cls" required>${classOptions(p.cls)}</select></label>
          <label>${m.groupMode === 'none' ? '姓名' : '姓名／暱稱'}<input id="nm" maxlength="20" required value="${esc(p.name || '')}" autocomplete="off"></label>
          ${groupSel}
          <button class="btn btn-yellow big">${s.me ? '更新資料' : '加入'}</button>
          ${s.me ? '<button type="button" class="btn" id="cancel">取消</button>' : ''}
        </form>
      </div>`;
    if ($('#cancel')) $('#cancel').onclick = () => { editing = false; render(); };
    $('#jf').onsubmit = async (e) => {
      e.preventDefault();
      const data = {
        cls: $('#cls').value,
        name: $('#nm').value.trim().slice(0, 20),
        group: $('#grp') ? Number($('#grp').value) || 0 : 0,
      };
      if (!data.cls || !data.name) return toast('請選班級並填姓名');
      if (m.groupMode !== 'none' && !data.group) return toast('請選組別');
      saveProfile(data);
      try {
        await fb.update(r(`/players/${uid}`), s.me ? data : { ...data, joinedAt: fb.serverTimestamp() });
        editing = false;
        document.activeElement && document.activeElement.blur();
        render();
      } catch (err) { toast(authErrorText(err)); }
    };
  }

  function header() {
    const me = s.me;
    return `${s.meta.className ? `<div class="room-cls">${esc(s.meta.className)}・課堂搶答</div>` : ''}<div class="me"><div><div class="name">${esc(me.name)}</div>
      <div class="muted">${esc([me.cls, groupLabel(me.group)].filter(Boolean).join('・'))}</div></div>
      <div class="score">${me.score || 0} 分</div></div>`;
  }

  function renderPending() {
    main.innerHTML = `${header()}
      <div class="card center"><h2>已送出，等待老師核准…</h2><p>請看大螢幕上有沒有你的名字。</p>
      <button class="btn" id="edit">修改資料</button></div>`;
    $('#edit').onclick = () => { editing = true; render(); };
  }

  function renderPlay() {
    const m = s.meta;
    if (m.phase === 'lobby') {
      return void (main.innerHTML = `${header()}<div class="card center"><h2>✅ 已加入！</h2><p>等老師開始…</p></div>`);
    }
    if (m.phase === 'ended') return renderEnded();
    if (isSpell(m)) return renderSpell();
    if (isChoice(m)) return renderAnswer();
    renderBuzz();
  }

  /** 活動結束：顯示自己（或自己組）的名次與分數。 */
  function renderEnded() {
    const rows = leaderboard(s.players, s.meta);
    let rank = 0;
    rows.forEach((u, i) => { if (i === 0 || u.score !== rows[i - 1].score) rank = i + 1; u.rank = rank; });
    const grouped = (s.meta.groupMode === 'first' || s.meta.groupMode === 'single') && s.me.group;
    const mine = rows.find((u) => u.key === (grouped ? `g${s.me.group}` : uid));
    const medal = { 1: '🥇 冠軍', 2: '🥈 亞軍', 3: '🥉 季軍' };
    const html = `${header()}<div class="card center">
      <h2>🏁 活動結束</h2>
      ${mine ? `<p style="font-size:2rem;font-weight:900;margin:.3em 0">${medal[mine.rank] || `第 ${mine.rank} 名`}</p>
        <p>${grouped ? `${esc(mine.name)}共 ` : ''}<b>${mine.score}</b> 分</p>` : ''}
      <p class="muted">請看大螢幕的頒獎台！</p></div>`;
    if (main._html !== html) { main._html = html; main.innerHTML = html; }
  }

  function myRank() {
    const grouped = (s.meta.groupMode === 'first' || s.meta.groupMode === 'single') && s.me.group;
    const i = s.ranked.findIndex((it) => it.uid === uid || (grouped && it.player.group === s.me.group));
    return i < 0 ? null : { n: i + 1, mine: s.ranked[i].uid === uid };
  }

  function renderBuzz() {
    const m = s.meta;
    let cls = 'ready', label = '準備', status = `第 ${esc(m.round)} 題`, enabled = true;
    const lockLeft = s.foul && m.penaltySec > 0 ? Math.ceil((s.foul.at + m.penaltySec * 1000 - serverNow()) / 1000) : 0;
    const rank = myRank();
    const groupTaken = rank && !rank.mine; // 同組已有人搶到（first/single 模式）

    if (s.buzz || pending === `buzz${m.round}`) {
      cls = s.judge === 'right' ? 'won' : 'done';
      label = rank ? `第 ${rank.n} 名` : '已按下';
      status = s.judge === 'right' ? `🎉 答對了！+${CORRECT_PTS}` : s.judge === 'wrong' ? '答錯了，下次加油' : '已搶答，等老師叫你';
      enabled = false;
    } else if (groupTaken) {
      cls = 'off'; label = `第 ${rank.n} 名`; status = '同組隊友已搶到'; enabled = false;
    } else if (s.foul && (m.penaltySec === -1 || lockLeft > 0)) {
      cls = 'foul'; enabled = false;
      label = m.penaltySec === -1 ? '偷跑' : `${lockLeft}`;
      status = m.penaltySec === -1 ? '偷跑！本題不能搶' : '偷跑！暫時鎖定';
    } else if (m.state === 'open') {
      cls = 'go'; label = '搶！'; status = '快按！';
    } else if (m.state === 'locked') {
      cls = 'off'; label = '鎖定'; status = '本題已鎖定'; enabled = false;
    } else {
      status = '等老師說開始…（太早按會偷跑）';
    }
    const html = `${header()}<div class="status">${status}</div>
      <button class="buzz ${cls}" id="buzz" ${enabled ? '' : 'disabled'}>${label}</button>`;
    if (main._html !== html) { main._html = html; main.innerHTML = html; $('#buzz').onpointerdown = press; }
  }

  async function press(e) {
    e.preventDefault();
    const m = s.meta;
    if (m.state === 'open') {
      pending = `buzz${m.round}`;
      sound.buzz(); navigator.vibrate && navigator.vibrate(60);
      render();
      try { await fb.set(r(`/buzzes/${m.round}/${uid}`), { at: fb.serverTimestamp() }); }
      catch { pending = null; toast('沒搶到（可能已鎖定）'); render(); }
    } else if (m.state === 'idle') {
      sound.foul(); navigator.vibrate && navigator.vibrate([80, 60, 80]);
      try { await fb.set(r(`/fouls/${m.round}/${uid}`), { at: fb.serverTimestamp() }); } catch {}
    }
  }

  // 複選題：學生正在勾選、還沒送出的選項（每題一份）
  const picks = new Map();
  const myPicks = (round) => { if (!picks.has(round)) picks.set(round, new Set()); return picks.get(round); };

  function renderAnswer() {
    const m = s.meta;
    const opts = optionList(m);
    const multi = isMulti(m);
    const mine = s.answer ? s.answer.c : (pending && pending.startsWith(`ans${m.round}:`) ? pending.split(':')[1] : null);
    const canPick = m.state === 'open' && !mine;
    const sel = myPicks(m.round);
    let status;
    const got = m.answer ? (choicePoints(s.roundAnswers, m.answer)[uid] || 0) : 0;
    if (m.answer) status = !mine ? `答案是 ${optionText(m.answer)}，你沒有作答` : mine === m.answer ? `🎉 答對了！+${got}` : `答錯了，答案是 ${optionText(m.answer)}`;
    else if (mine) status = multi ? `已送出 ${esc(mine)}，等老師公布答案` : '已送出，等老師公布答案';
    else if (m.state === 'open') status = multi ? '複選：點選所有你認為對的答案，再按「送出」' : '請選答案（只能選一次）';
    else if (m.state === 'locked') status = '時間到';
    else status = `第 ${esc(m.round)} 題・等老師說開始…${multi ? '（複選）' : ''}`;
    const inMine = (o) => !!mine && String(mine).includes(o);
    const inKey = (o) => !!m.answer && String(m.answer).includes(o);
    const html = `${header()}<div class="status">${status}</div>
      <div class="opts ${opts.length > 5 ? 'many' : ''}">${opts.map((o) => {
        let c = '';
        if (m.answer && inKey(o)) c = 'correct';
        else if (m.answer && inMine(o)) c = 'wrong';
        else if (inMine(o) || (canPick && multi && sel.has(o))) c = 'picked';
        return `<button class="btn ${c}" data-o="${o}" ${canPick ? '' : 'disabled'}>${optionText(o)}</button>`;
      }).join('')}</div>
      ${multi && canPick ? `<button class="btn btn-yellow big send-multi" id="sendMulti" ${sel.size ? '' : 'disabled'}>送出${sel.size ? `（${[...sel].sort().join('')}）` : ''}</button>` : ''}`;
    if (main._html === html) return;
    main._html = html; main.innerHTML = html;
    const send = async (c) => {
      pending = `ans${m.round}:${c}`;
      sound.buzz(); navigator.vibrate && navigator.vibrate(40);
      render();
      try { await fb.set(r(`/answers/${m.round}/${uid}`), { c, at: fb.serverTimestamp() }); }
      catch { pending = null; toast('送出失敗（可能已鎖定）'); render(); }
    };
    main.querySelectorAll('[data-o]').forEach((b) => {
      b.onclick = () => {
        if (!canPick) return;
        if (!multi) return send(b.dataset.o);
        // 複選：點一下選、再點一下取消
        if (sel.has(b.dataset.o)) sel.delete(b.dataset.o); else sel.add(b.dataset.o);
        navigator.vibrate && navigator.vibrate(15);
        render();
      };
    });
    const sm = $('#sendMulti');
    if (sm) sm.onclick = () => { if (sel.size) send([...sel].sort().join('')); };
  }

  /* ── 拼音題：作答中與送出後都是橫式全螢幕的覆蓋層（#sp），版面沿用「羅馬字拼音答題」v10 ── */
  let sp = null;            // 覆蓋層元素
  let spKey = null;         // 目前畫的是哪個畫面（避免別人作答時一直重畫）
  let spUsed = false;       // 這次 render 有沒有用到覆蓋層
  let spTab = 0;            // 韻母區目前所在的分類
  let spFont = '';          // 進入前的根字級（離開時還原）
  const spPicks = new Map(); // 每題學生選到一半的 { i, f, t }
  const spPick = (round) => { if (!spPicks.has(round)) spPicks.set(round, { i: null, f: null, t: null }); return spPicks.get(round); };

  function renderSpell() {
    const m = s.meta;
    const mine = s.answer ? s.answer.c : (pending && pending.startsWith(`ans${m.round}:`) ? pending.slice(`ans${m.round}:`.length) : null);
    if (mine) { spUsed = true; return spResult(mine); }
    if (m.state === 'open') { spUsed = true; return spCompose(); }
    const status = m.state === 'locked'
      ? (m.answer ? `時間到，你沒有作答・答案是 ${esc(spellText(m.answer))}` : '時間到')
      : `第 ${esc(m.round)} 題・拼音題，等老師說開始…`;
    const html = `${header()}<div class="status">${status}</div>
      <div class="card center"><p>開始後畫面會轉成<b>橫式</b>：<br>選<b>聲母＋韻母＋聲調</b>，再按「<b>送出</b>」。<br>送出後不能修改。</p></div>`;
    if (main._html !== html) { main._html = html; main.innerHTML = html; }
  }

  function spOpen() {
    if (sp) return;
    sp = document.createElement('div');
    sp.id = 'sp';
    document.body.appendChild(sp);
    spFont = document.documentElement.style.fontSize;
    window.addEventListener('resize', spLayout);
    sp.addEventListener('click', spClick);
    sp.addEventListener('pointerup', spFullscreen, { once: true });
    spFullscreen();
  }
  function spClose() {
    if (!sp) return;
    sp.remove(); sp = null; spKey = null;
    document.documentElement.style.fontSize = spFont;
    window.removeEventListener('resize', spLayout);
  }
  function spFullscreen() {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;     // iPhone Safari 不支援，靠 CSS 旋轉即可
    try {
      const p = req.call(el, { navigationUI: 'hide' });
      if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
    } catch {}
  }
  /** 直拿手機時把覆蓋層轉 90 度成橫式；根字級隨畫面大小縮放。 */
  function spLayout() {
    if (!sp) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    const portrait = vh > vw;
    const W = portrait ? vh : vw, H = portrait ? vw : vh;
    sp.style.width = `${W}px`; sp.style.height = `${H}px`;
    sp.style.transform = portrait ? `translateX(${vw}px) rotate(90deg)` : 'none';
    document.documentElement.style.fontSize = `${Math.max(9, Math.min(H / 19, W / 36))}px`;
    const box = sp.querySelector('.sp-fscroll');
    if (box) {
      const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
      box.style.setProperty('--final-cols', Math.max(4, Math.min(9, Math.floor((box.clientWidth + 0.3 * rem) / (4.2 * rem)))));
    }
    spFitLabels();
    spFitWord();
  }
  /** 同一區的按鈕統一縮小字級，讓最長的標籤也塞得進框（同 v10 fitLabels）。 */
  function spFitLabels() {
    if (!sp) return;
    const labels = [...sp.querySelectorAll('.sp-lbl')];
    labels.forEach((l) => { l.style.fontSize = ''; });
    const groups = new Map();
    labels.forEach((l) => {
      const b = l.parentElement;
      const cs = getComputedStyle(b);
      const avail = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const need = l.offsetWidth;
      if (!avail || !need) return;
      const key = b.closest('.sp-fgrid, .sp-grid, .sp-tabs') || b.parentElement;
      const g = groups.get(key) || { ratio: 1, items: [] };
      g.ratio = Math.min(g.ratio, (avail * 0.9) / need);
      g.items.push([l, parseFloat(getComputedStyle(l).fontSize)]);
      groups.set(key, g);
    });
    groups.forEach((g) => { if (g.ratio < 1) g.items.forEach(([l, f]) => { l.style.fontSize = `${(f * g.ratio).toFixed(1)}px`; }); });
  }
  /** 舉牌：字級放大到幾乎佔滿畫面。 */
  function spFitWord() {
    const word = sp && sp.querySelector('.sp-word');
    if (!word) return;
    const W = sp.clientWidth, H = sp.clientHeight;
    const size = H * 0.5;
    word.style.fontSize = `${size}px`;
    const scale = Math.min((W * 0.92) / word.scrollWidth, (H * 0.6) / word.scrollHeight, 1);
    word.style.fontSize = `${Math.floor(size * scale)}px`;
  }

  const tile = (attrs, label, sel, extra = '') => `<button class="sp-tile${sel ? ' selected' : ''}${extra}" ${attrs}><span class="sp-lbl">${label}</span></button>`;

  function spCompose(force = false) {
    const m = s.meta;
    const key = `c:${m.round}`;
    if (spKey === key && !force) return;
    spOpen();
    const st = spPick(m.round);
    const keepScroll = force && sp.querySelector('.sp-fscroll') ? sp.querySelector('.sp-fscroll').scrollTop : 0;
    spKey = key;
    const ready = st.i !== null && st.f !== null && st.t !== null;
    const slot = (v, label) => (v === null ? `<div class="sp-slot"><small>${label}</small></div>` : `<div class="sp-slot filled">${v === '' ? '∅' : esc(v)}</div>`);
    const initials = INITIAL_ROWS.map((row) => `<div class="sp-grow">${row.items.map((t) => tile(`data-pi="${t}"`, t, st.i === t)).join('')}
      ${row.zeroAfter ? tile('data-pi="" style="flex-grow:3"', '無聲母', st.i === '', ' zero') : ''}</div>`).join('');
    const tabs = FINAL_TABS.map((tab, i) => {
      const picked = st.f !== null && tab.rows.some((r) => r.items.includes(st.f));
      return `<button class="sp-tab${i === spTab ? ' active' : ''}${picked ? ' has-pick' : ''}" data-ptab="${i}"><span class="sp-lbl">${tab.label}</span></button>`;
    }).join('');
    const finals = FINAL_TABS.map((tab, i) => `<div class="sp-fsec" data-fsec="${i}"><div class="sp-fsec-title">${tab.title}</div>
      <div class="sp-fgrid">${tab.rows.flatMap((r) => r.items).map((f) => tile(`data-pf="${f}"`, f, st.f === f)).join('')}</div></div>`).join('');
    const tones = TONES.map((t) => `<button class="sp-tile${st.t === t.n ? ' selected' : ''}" data-pt="${t.n}"><span class="n">${t.n}</span><span class="ex">${t.ex}</span></button>`).join('');
    sp.innerHTML = `<section class="sp-compose">
      <div class="sp-top">
        <span class="sp-who">${esc(s.me.name)}・第 ${esc(m.round)} 題</span>
        <div class="sp-combo">${slot(st.i, '聲母')}<span class="sp-plus">+</span>${slot(st.f, '韻母')}<span class="sp-plus">+</span>${slot(st.t, '聲調')}</div>
        <button class="sp-tool" data-sp="clear">清除</button>
        <button class="sp-send${ready ? ' ready' : ''}" data-sp="send" ${ready ? '' : 'disabled'}>送出 ▶</button>
      </div>
      <div class="sp-panels">
        <div class="sp-panel sp-p-initial"><div class="sp-ptitle">聲母</div><div class="sp-grid">${initials}</div></div>
        <div class="sp-panel sp-p-final"><div class="sp-tabs">${tabs}</div><div class="sp-fscroll">${finals}</div></div>
        <div class="sp-panel sp-p-tone"><div class="sp-ptitle">聲調</div><div class="sp-tgrid">${tones}</div></div>
      </div></section>`;
    const box = sp.querySelector('.sp-fscroll');
    box.scrollTop = keepScroll;
    box.addEventListener('scroll', spSyncTab, { passive: true });
    spLayout();
  }
  /** 韻母區捲動時自動標出目前所在的分類。 */
  function spSyncTab() {
    const box = sp && sp.querySelector('.sp-fscroll');
    if (!box) return;
    let cur = 0;
    box.querySelectorAll('[data-fsec]').forEach((sec, i) => { if (sec.offsetTop <= box.scrollTop + 4) cur = i; });
    if (box.scrollTop + box.clientHeight >= box.scrollHeight - 2) cur = FINAL_TABS.length - 1;
    if (cur === spTab) return;
    spTab = cur;
    sp.querySelectorAll('[data-ptab]').forEach((b, i) => b.classList.toggle('active', i === cur));
  }
  function spClick(e) {
    const b = e.target.closest('button');
    if (!b || !s || spKey !== `c:${s.meta.round}`) return;
    const m = s.meta;
    const st = spPick(m.round);
    if ('ptab' in b.dataset) {
      spTab = Number(b.dataset.ptab);
      const box = sp.querySelector('.sp-fscroll');
      box.scrollTop = sp.querySelector(`[data-fsec="${spTab}"]`).offsetTop;
      sp.querySelectorAll('[data-ptab]').forEach((x, i) => x.classList.toggle('active', i === spTab));
      return;
    }
    const toggle = (k, v) => { st[k] = st[k] === v ? null : v; navigator.vibrate && navigator.vibrate(15); spCompose(true); };
    if ('pi' in b.dataset) return toggle('i', b.dataset.pi);
    if ('pf' in b.dataset) return toggle('f', b.dataset.pf);
    if ('pt' in b.dataset) return toggle('t', b.dataset.pt);
    if (b.dataset.sp === 'clear') { st.i = st.f = st.t = null; return spCompose(true); }
    if (b.dataset.sp === 'send' && st.i !== null && st.f !== null && st.t !== null) spSend(encode(st));
  }
  async function spSend(c) {
    const m = s.meta;
    pending = `ans${m.round}:${c}`;
    sound.buzz(); navigator.vibrate && navigator.vibrate(40);
    render();
    try { await fb.set(r(`/answers/${m.round}/${uid}`), { c, at: fb.serverTimestamp() }); }
    catch { pending = null; toast('送出失敗（可能已鎖定）'); render(); }
  }

  /** 送出後：全螢幕舉牌色塊；老師公布答案後在聲母、韻母、聲調上標 ✓／✗ 並顯示得分。 */
  function spResult(c) {
    const m = s.meta;
    const key = `r:${m.round}:${c}:${m.answer || ''}`;
    if (spKey === key) return;
    spOpen();
    spKey = key;
    const d = decode(c);
    const parts = m.answer ? spellParts(c, m.answer) : null;
    const mark = (ok) => (parts ? `<span class="sp-mark ${ok ? 'ok' : 'ng'}"><span>${ok ? '✓' : '✗'}</span></span>` : '');
    const ic = initialCat(d.i);
    const fc = finalCat(d.f);
    const g = s.me.group;
    const [gbg, gfg] = g ? GROUP_COLORS[(g - 1) % GROUP_COLORS.length] : ['#111111', '#FFD400'];
    const pts = m.answer ? (roundPoints(m, s.roundAnswers, m.answer)[uid] || 0) : 0;
    const status = !m.answer ? '已送出，等老師公布答案'
      : parts.all ? `🎉 全對！<b>+${pts}</b> 分`
      : `${pts ? `<b>+${pts}</b> 分・` : '沒有得分・'}答案是 <b>${esc(spellText(m.answer))}</b>`;
    sp.innerHTML = `<section class="sp-result">
      <div class="sp-rgroup" style="background:${gbg};color:${gfg}">${g ? `第 ${g} 組・` : ''}${esc(s.me.name)}</div>
      <div class="sp-word">
        <div class="sp-rb${d.i ? '' : ' zero'}" style="${d.i ? `background:${ic.bg};color:${ic.fg}` : ''}"><span class="txt">${d.i || '∅'}</span><span class="cat">${ic.name}</span>${mark(parts && parts.i)}</div>
        <div class="sp-rb" style="background:${fc.bg};color:${fc.fg}"><span class="txt">${toneFinal(d.f, d.t)}</span><span class="cat">${fc.name}</span>${mark(parts && parts.f)}</div>
      </div>
      <div class="sp-rstatus">${status}</div>
      <div class="sp-rtone">第 <b>${d.t}</b> 調${parts ? `<span class="sp-tm ${parts.t ? 'ok' : 'ng'}">${parts.t ? '✓' : '✗'}</span>` : ''}</div>
    </section>`;
    spLayout();
  }

}
</script>
</body>
</html>
