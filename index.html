<body>
<header class="topbar">
  <span class="title" title="v21">課堂搶答</span>
  <span id="roomTag" class="badge st-open" hidden></span>
  <button class="btn sm" id="bBack" hidden>← 教室清單</button>

  <button class="btn sm" id="bDrawer" hidden>⚙ 名單／設定</button>

</header>
<main class="wrap-page" id="main"><p class="muted center">載入中…</p></main>
<aside class="drawer" id="drawer">
  <div class="row between"><h3>名單／設定</h3><button class="btn sm" id="bClose">✕</button></div>
  <div class="panel" id="dPlayers"></div>
  <div class="panel settings" id="dSettings"></div>
</aside>
<script type="module">
import { newRoomId, normalizeRoom, esc, $, toast, groupLabel, byGroupSeat, playerSorter, isChoice, QTYPES, googleSignIn, authErrorText, DEFAULT_META, GROUP_MODES } from './assets/core.js?v=41';
import {
  bootFirebase, isTeacherUser, teacherName, mountAccountMenu, listMyRooms, createRoom, watchRoom, makeActions, runJobs, remainingSec,
  patch, orderHTML, answerHTML, liveChipsHTML, notBuzzedHTML, pendingBarHTML, boardHTML, podiumHTML, controlsHTML, playersHTML, settingsHTML, bindControls, stateText, syncLive, qtypeLabel, groupSettingsHTML, cleanCap,
} from './assets/teacher.js?v=41';
import { sound } from './assets/sound.js?v=41';

const main = $('#main');
/** v37：等候畫面把已排序的 [uid, player] 依組別切成一列一組。 */
const lobbyGroups = (list) => {
  const out = [];
  for (const e of list) {
    const g = Number(e[1].group) || 0;
    if (!out.length || out[out.length - 1][0] !== g) out.push([g, []]);
    out[out.length - 1][1].push(e);
  }
  return out;
};
/**
 * v39：電腦投影的等候畫面——組別與姓名卡片全部塞進一個畫面，不溢出。
 * 以二分搜尋找出卡片區放得下的最大字級（--gfs，設在 #main 上，重繪 innerHTML 不會掉），
 * 縮到最小仍放不下才讓卡片區捲動。手機（未鎖 100dvh）維持原本字級、整頁捲動。
 */
const GFS_MAX = 40, GFS_MIN = 9;
let fitBox = null;
const fitObs = 'ResizeObserver' in window ? new ResizeObserver(() => fitLobby()) : null;
/**
 * v40：卡片區改成多欄（CSS columns＋column-fill:auto）：先把左欄排滿，滿了才往右欄排。
 * 依序試 1～N 欄，每種欄數用二分搜尋找最大字級；取字級最大者（同字級取欄數少的），畫面不大量留白。
 */
function fitLobby() {
  const box = main.querySelector('.gcards');
  if (!box) return;
  if (fitObs && box !== fitBox) { if (fitBox) fitObs.unobserve(fitBox); fitObs.observe(box); fitBox = box; }
  const fitMode = document.body.classList.contains('fit') && window.matchMedia('(min-width: 901px)').matches;
  if (!fitMode) { main.style.removeProperty('--gfs'); main.style.removeProperty('--gcols'); return; }
  // 多欄時卡片寬度受欄寬限制，姓名不可被截斷：每張卡片內容也要放得下
  const cardsOk = () => [...box.querySelectorAll('.pcard .pc-name')].every((n) => n.scrollWidth <= n.clientWidth + 1);
  const fits = (px) => { main.style.setProperty('--gfs', `${px}px`); return box.scrollHeight <= box.clientHeight + 1 && box.scrollWidth <= box.clientWidth + 1 && cardsOk(); };
  const best = (cols) => {
    main.style.setProperty('--gcols', cols);
    if (fits(GFS_MAX)) return GFS_MAX;
    if (!fits(GFS_MIN)) return 0;
    let lo = GFS_MIN, hi = GFS_MAX;
    while (hi - lo > 0.25) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
    return lo;
  };
  const maxCols = box.classList.contains('solo') ? 6 : 4;
  let pick = 1, pickFs = -1;
  for (let c = 1; c <= maxCols; c++) {
    const fs = best(c);
    if (fs > pickFs + 0.5) { pick = c; pickFs = fs; }
    if (fs >= GFS_MAX) break;
  }
  main.style.setProperty('--gcols', pick);
  fits(pickFs > 0 ? pickFs : GFS_MIN);
  box.style.overflow = pickFs > 0 ? '' : 'auto'; // 縮到最小仍放不下才出現捲軸
}
let fitTimer = 0;
window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitLobby, 80); });
if (document.fonts) document.fonts.ready.then(() => fitLobby());
const qrCache = new Map();
function qrImg(text) {
  if (!qrCache.has(text)) {
    const box = document.createElement('div');
    new QRCode(box, { text, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
    const c = box.querySelector('canvas');
    qrCache.set(text, c ? c.toDataURL() : (box.querySelector('img') || {}).src);
  }
  return `<img alt="QR code" src="${qrCache.get(text)}">`;
}
const base = new URL('./', location.href).href;
const joinUrl = (rid) => `${base}join.html?room=${rid}`;
const remoteUrl = (rid) => `${base}remote.html?room=${rid}`;
// ?view=public：監看畫面。老師已登入時也強制顯示公開投影（同一瀏覽器的新分頁共用登入狀態）
const watch = new URL(location.href).searchParams.get('view') === 'public';
const roomUrl = (rid, w = watch) => `?room=${rid}${w ? '&view=public' : ''}`;
const listUrl = watch ? `${base}?view=public` : base;
const isPhone = () => window.matchMedia('(max-width: 820px)').matches;
const PHASE_TEXT = { lobby: '等待加入', game: '進行中', ended: '已結束' };

/* ── 頂列按鈕 ── */
$('#bFull').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
$('#bSound').onclick = (e) => { sound.setMuted(!sound.muted); e.target.textContent = sound.muted ? '🔇 音效關' : '🔊 音效開'; };
$('#bDrawer').onclick = () => $('#drawer').classList.toggle('open');
$('#bClose').onclick = () => $('#drawer').classList.remove('open');
$('#bBack').onclick = () => { location.href = listUrl; };

const boot = await bootFirebase(main);
if (boot) start(boot);

/* 進入點：教師帳號 → 教師模式；未登入（或非教師）→ 公開投影模式，不用登入就能選教室觀看 */
async function start({ fb, user }) {
  const rid = normalizeRoom(new URL(location.href).searchParams.get('room'));
  if (watch && user) {
    // 監看畫面：沿用目前登入讀資料，不顯示教師控制；右上角提供回教師模式
    const back = rid ? `${base}?room=${rid}` : base;
    $('#who').innerHTML = `<a class="btn sm btn-yellow" style="text-decoration:none" href="${esc(back)}">教師模式</a>`;
    if (rid) return enterRoom(fb, rid, { owner: false });
    return publicList(fb);
  }
  if (isTeacherUser(user)) {
    document.title = `教師模式．${teacherName(user)}`;     // 分頁標題顯示教師姓名（Google 顯示名稱），好跟監看分頁區分
    mountAccountMenu(fb, user);
    if (rid) {
      const meta = (await fb.get(fb.ref(fb.db, `buzzRooms/${rid}/meta`))).val();
      if (meta) return enterRoom(fb, rid, { owner: meta.ownerUid === user.uid });
      toast(`教室 ${rid} 不存在或已關閉`);
      history.replaceState(null, '', location.pathname);
    }
    return picker(fb, user);
  }

  // 公開模式：右上角放「教師登入」；已用非教師的 Google 帳號登入時改成帳號選單，並提示無權限
  const noPerm = !!user && !user.isAnonymous;
  if (noPerm) {
    mountAccountMenu(fb, user);
  } else {
    $('#who').innerHTML = '<button class="btn sm btn-yellow" id="bLogin">教師登入</button>';
    $('#bLogin').onclick = async () => {
      try {
        const u = await googleSignIn();
        if (!isTeacherUser(u)) toast('您無權限建立教室或請切換帳號', 4000);
        setTimeout(() => location.reload(), isTeacherUser(u) ? 0 : 1200);
      } catch (e) { if (e.code !== 'auth/popup-closed-by-user') toast(authErrorText(e)); }
    };
  }
  if (!user) {
    try { user = (await fb.signInAnonymously(fb.auth)).user; } catch (e) {
      main.innerHTML = `<div class="card narrow center"><h2>無法連線</h2><p>${esc(authErrorText(e))}</p></div>`;
      return;
    }
  }
  if (rid) return enterRoom(fb, rid, { owner: false });
  publicList(fb, noPerm ? user : null);
}

/** 公開教室清單：各老師的教室分開列出，即時更新，點選後投影該教室。 */
function publicList(fb, noPermUser = null) {
  main.innerHTML = '<p class="muted center">讀取教室清單…</p>';
  const off = fb.onValue(fb.ref(fb.db, 'buzzLive'), (snap) => {
    const day = Date.now() - 24 * 3600 * 1000;
    const rooms = Object.entries(snap.val() || {})
      .map(([rid, r]) => ({ rid, ...r }))
      .filter((r) => (r.createdAt || 0) > day)
      .sort((a, b) => b.createdAt - a.createdAt);
    patch(main, `
      <div class="rooms-page">
        <h2>進行中的教室</h2>
        ${noPermUser ? `<div class="noperm" role="alert"><b>您無權限建立教室或請切換帳號</b>
          <span>目前登入：${esc(noPermUser.email || '')}。只有授權的教師帳號能建立教室；你仍可選下方教室觀看。</span>
          <button class="btn sm btn-yellow" data-acct-switch>⇄ 切換帳號</button></div>` : ''}
        <p class="muted">選擇要投影的教室。老師請用手機按右上角「教師登入」建立教室並操作。</p>
        ${rooms.length ? `<div class="room-grid">${rooms.map((r) => `
          <button class="room-card" data-rid="${esc(r.rid)}">
            <span class="rc-code">${esc(r.rid)}</span>
            <span class="rc-class">${esc(r.className || '（未命名班級）')}</span>
            <span class="rc-owner">${esc(r.ownerName || '老師')}</span>
            <span class="rc-meta"><span class="badge ${r.phase === 'game' ? 'st-open' : r.phase === 'ended' ? 'st-locked' : 'st-idle'}">${PHASE_TEXT[r.phase] || ''}</span>
              ${r.n || 0} 人・${new Date(r.createdAt).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })} 開始</span>
          </button>`).join('')}</div>`
          : '<div class="card center"><h3>目前沒有進行中的教室</h3><p>老師建立教室後會自動出現在這裡。</p></div>'}
      </div>`);
  });
  main.addEventListener('click', async (e) => {
    if (!e.target.closest('[data-acct-switch]')) return;
    try {
      const u = await googleSignIn();
      if (!isTeacherUser(u)) toast('您無權限建立教室或請切換帳號', 4000);
      setTimeout(() => location.reload(), isTeacherUser(u) ? 0 : 1200);
    } catch (err) { if (err.code !== 'auth/popup-closed-by-user') toast(authErrorText(err)); }
  });
  main.onclick = (e) => {
    const c = e.target.closest('.room-card');
    if (!c) return;
    off();
    main.onclick = null;
    main._html = null;
    history.pushState(null, '', roomUrl(c.dataset.rid));
    enterRoom(fb, c.dataset.rid, { owner: false });     // 同頁切換，點擊同時解鎖音效
  };
  window.onpopstate = () => location.reload();
}

async function picker(fb, user) {
  // 首頁也能一鍵開監看分頁：開公開教室清單，再從清單選教室投影
  $('#bWatch').hidden = false;
  $('#bWatch').onclick = () => window.open(`${base}?view=public`, '_blank');
  const rooms = await listMyRooms(fb, user.uid);
  const go = (rid) => (isPhone() ? location.assign(remoteUrl(rid)) : enterRoom(fb, rid, { owner: true }));
  main.innerHTML = `
    <div class="card narrow">
      <h2>開始一場搶答</h2>
      <form id="fNew" class="new-room">
        <label>班級名稱<input id="cName" maxlength="20" required placeholder="例如 KJ21、高一3" autocomplete="off"></label>
        ${groupSettingsHTML(DEFAULT_META, { withAttr: false })}
        <button class="btn btn-yellow big" id="bNew" style="width:100%">＋ 建立新教室</button>
      </form>
      <p class="note">${isPhone() ? '建立後進入手機控制頁；教室電腦打開本網址（不用登入）選這個教室投影。' : '投影電腦不用登入也能從教室清單選教室投影。'}</p>
      ${rooms.length ? `<h3 style="margin-top:18px">繼續之前的教室（24 小時內）</h3>
        <ul class="plist">${rooms.map((r) => `<li><span class="who">${r.rid}<small>${new Date(r.createdAt).toLocaleString('zh-TW')}</small></span>
          <button class="btn sm" data-rid="${r.rid}">繼續</button></li>`).join('')}</ul>` : ''}
    </div>`;
  // v40：組別選「個人」時，數字框改成「作答人數上限」預設 50；切回分組回到每組 2 人
  $('#gCount').addEventListener('change', (e) => {
    const solo = e.target.value === 'solo';
    $('#fNew [data-caplabel]').textContent = solo ? '作答人數上限' : '每組作答數';
    $('#gCap').value = solo ? 50 : 2;
    $('#gCap').placeholder = `例如 ${solo ? 50 : 2}`;
  });
  $('#gCap').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/\D/g, '').slice(0, 2); });
  $('#fNew').onsubmit = async (e) => {
    e.preventDefault();
    const name = $('#cName').value.trim();
    if (!name) { toast('請輸入班級名稱'); $('#cName').focus(); return; }
    $('#bNew').disabled = true;
    const cap = cleanCap($('#gCap').value);
    if (!cap) { toast(`${$('#gCount').value === 'solo' ? '作答人數上限' : '每組作答數'}請輸入 1～99 的數字`); $('#gCap').focus(); $('#bNew').disabled = false; return; }
    try { go(await createRoom(fb, user, newRoomId, name, { groupCap: cap, groupCount: $('#gCount').value })); } catch (err) { toast(err.message); $('#bNew').disabled = false; }
  };
  main.querySelectorAll('[data-rid]').forEach((b) => { b.onclick = () => go(b.dataset.rid); });
}

function enterRoom(fb, rid, { owner }) {
  history.replaceState(null, '', roomUrl(rid));
  document.body.classList.add('fit');     // 電腦橫式畫面：整頁固定在視窗內，不出現捲軸
  $('#roomTag').hidden = false; $('#roomTag').textContent = rid;
  fb.get(fb.ref(fb.db, `buzzRooms/${rid}/meta/className`)).then((v) => { if (v.val()) $('#roomTag').textContent = `${v.val()}・${rid}`; }).catch(() => {});
  $('#bBack').hidden = owner;
  $('#bWatch').hidden = !owner;     // 首頁顯示過監看鈕，進非自己的教室時要藏起來
  if (owner) {
    $('#bRemote').hidden = false; $('#bDrawer').hidden = false; $('#bWatch').hidden = false;
    $('#bWatch').onclick = () => window.open(`${base}${roomUrl(rid, true)}`, '_blank');
    $('#bRemote').onclick = () => {
      const m = document.createElement('div');
      m.className = 'modal';
      m.innerHTML = `<div class="qrbox"><h3 style="color:#111">老師用手機掃描遙控</h3><div class="qr">${qrImg(remoteUrl(rid))}</div>
        <p class="url">${esc(remoteUrl(rid))}</p><button class="btn btn-yellow">關閉</button></div>`;
      m.onclick = (e) => { if (e.target === m || e.target.tagName === 'BUTTON') m.remove(); };
      document.body.appendChild(m);
    };
  }

  let s = null;
  let tab = 'live';            // live：本題畫面｜board：排行榜
  // 教師模式的「學生答案」面板（王曉明 A）：預設顯示；要投影給學生看時可暫時隱藏（重新整理後恢復顯示）
  let showLive = true;
  // 進行中畫面右欄的 QR code：預設收合，把空間讓給控制區
  let qrOpen = false;
  const prev = { players: 0, state: null, round: null, first: null, cd: null, phase: null };
  const act = owner ? makeActions(fb, rid, () => s) : null;
  if (owner) {
    bindControls(main, act, { onCleared: () => location.replace(location.pathname) });
    bindControls($('#drawer'), act, { onCleared: () => location.replace(location.pathname) });
  }
  main.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab]');
    if (t) { tab = t.dataset.tab; render(); }
    if (e.target.closest('[data-live-toggle]')) { showLive = !showLive; render(); }
    if (e.target.closest('[data-qr-toggle]')) { qrOpen = !qrOpen; render(); }
    // 點虛線卡片本身＝快速核准（點卡片上的按鈕時不算）
    const c = e.target.closest('.pcard.pending');
    if (c && owner && !e.target.closest('[data-act]')) act.approve(c.dataset.uid);
  });

  watchRoom(fb, rid, (next) => {
    if (!next) {
      s = null;
      main._html = null;
      main.innerHTML = `<div class="card narrow center"><h2>教室已關閉</h2><a class="btn btn-yellow" href="${listUrl}">回教室清單</a></div>`;
      return;
    }
    s = next;
    effects();
    render();
    if (owner) { runJobs(s, act); syncLive(fb, rid, s); }
  });

  // 排序題老師勾選正解（只存在本頁）時重畫
  window.addEventListener('buzz:redraw', () => { if (s) render(); });
  setInterval(() => {
    if (!s) return;
    if (owner) runJobs(s, act);
    const left = remainingSec(s.meta);
    document.querySelectorAll('[data-cd]').forEach((el) => { el.textContent = left == null ? '' : `${left}`; });
    if (left != null && left !== prev.cd && left <= 3 && left > 0) sound.tick();
    prev.cd = left;
  }, 200);

  /** 依資料變化播音效 */
  function effects() {
    const n = Object.keys(s.players).length;
    if (n > prev.players && prev.state !== null) sound.join();
    prev.players = n;
    const m = s.meta;
    if (prev.state !== null) {
      if (m.state === 'open' && (prev.state !== 'open' || prev.round !== m.round)) sound.open();
      if (m.state === 'locked' && prev.state === 'open') sound.end();
      if (m.phase === 'ended' && prev.phase !== 'ended') sound.first();
    }
    const first = s.ranked[0] && `${m.round}/${s.ranked[0].uid}`;
    if (first && first !== prev.first && prev.state !== null && !isChoice(m)) sound.first();
    prev.first = first; prev.state = m.state; prev.round = m.round; prev.phase = m.phase;
  }

  function sideHTML() {
    const box = `<div class="qrbox"><div class="qr">${qrImg(joinUrl(rid))}</div><div class="code">${rid}</div>
      <a class="url" href="${esc(joinUrl(rid))}" target="_blank" rel="noopener">${esc(joinUrl(rid))}</a></div>`;
    if (!owner) return box;
    // 教師模式：QR 放在控制區下方、可收合（預設收合）
    return `<div class="qr-fold${qrOpen ? ' open' : ''}">
      <button class="btn sm qr-toggle" data-qr-toggle>${qrOpen ? '▾ 收合 QR code' : `▸ 加入 QR code（${rid}）`}</button>
      ${qrOpen ? box : ''}</div>`;
  }

  function render() {
    const m = s.meta;
    if (owner) {
      patch($('#dPlayers'), playersHTML(s));
      patch($('#dSettings'), settingsHTML(s));
      // 頂列按鈕跟手機「名單」分頁一樣顯示待核准人數
      const pendN = Object.values(s.players).filter((p) => !p.approved).length;
      const label = pendN ? `⚙ 名單／設定（${pendN} 待核准）` : '⚙ 名單／設定';
      if ($('#bDrawer').textContent !== label) $('#bDrawer').textContent = label;
      $('#bDrawer').classList.toggle('btn-yellow', pendN > 0);
    }

    if (m.phase === 'ended') {
      patch(main, `<div class="ended-wrap">${podiumHTML(s)}${owner ? `<div class="panel ended-ctl">${controlsHTML(s)}</div>` : ''}</div>`);
      return;
    }

    if (m.phase === 'lobby') {
      const list = Object.entries(s.players).sort(playerSorter(m)); // v41：個人模式只依座號； // v37：第 1 組排到最後一組，組內依座號
      const ok = list.filter(([, p]) => p.approved).length;
      const pend = list.length - ok;
      patch(main, `
        <div class="lobby">
          <div class="qrbox"><div class="qr">${qrImg(joinUrl(rid))}</div>
            <div class="code">${rid}</div><a class="url" href="${esc(joinUrl(rid))}" target="_blank" rel="noopener">${esc(joinUrl(rid))}</a></div>
          <div>
            <div class="row between wrap">
              <div class="count-big">${m.className ? `<span class="cls-tag">${esc(m.className)}</span>` : ''}已加入 <b>${ok}</b> 人${pend ? `　待核准 <b>${pend}</b>` : ''}</div>
              ${owner ? `<div class="row">
                <button class="btn" data-act="approveAll" ${pend ? '' : 'disabled'}>全部核准${pend ? `（${pend}）` : ''}</button>
                <button class="btn btn-yellow" data-act="game">進入搶答 ▶</button>
              </div>` : `<span class="badge st-idle">${esc(m.ownerName || '老師')}・等待開始</span>`}
            </div>
            ${owner ? groupSettingsHTML(m) : `<p class="muted">${m.groupMode === 'none' ? `個人作答・上限 ${esc(m.groupCap || 50)} 人` : m.groupMode === 'cap' ? `每組 ${esc(m.groupCap)} 人作答` : esc(GROUP_MODES[m.groupMode] || '')}${m.groupMode === 'none' ? '' : `・${m.groupCount} 組`}</p>`}
            <p class="muted">手機掃描 QR code，電腦直接點 QR 下方的網址加入。${owner ? '虛線卡片＝待核准（點卡片即核准）；滑鼠移到卡片上可核准、改名、移除。' : '虛線卡片＝等待老師核准。'}</p>
            <div class="cards gcards${m.groupMode === 'none' ? ' solo' : ''}">${(m.groupMode === 'none' ? [[0, list]] : lobbyGroups(list)).map(([g, rows]) => `
              <div class="grow">${m.groupMode === 'none' ? '' : `<div class="glabel">${g ? esc(groupLabel(g)) : '未分組'}</div>`}<div class="gitems">${rows.map(([uid, p]) => `
              <div class="pcard ${p.approved ? '' : 'pending'} ${s.presence[uid] ? '' : 'offline'}" data-uid="${uid}">
                <span class="pc-name">${esc(p.name)}<small>${esc(p.cls || '')}</small></span>
                ${owner ? `<span class="pc-acts">
                  ${p.approved ? '' : `<button class="btn sm btn-yellow" data-act="approve" data-uid="${uid}">核准</button>`}
                  <button class="btn sm" data-act="rename" data-uid="${uid}">改名</button>
                  <button class="btn sm danger" data-act="kick" data-uid="${uid}">移除</button></span>` : ''}</div>`).join('')}</div></div>`).join('')}</div>
          </div>
        </div>`);
      fitLobby();
      return;
    }

    const choice = isChoice(m);
    let stage;
    if (tab === 'board') stage = boardHTML(s);
    else if (choice) stage = m.state === 'idle' ? '<div class="bigmsg">準備作答…</div>' : answerHTML(s, { big: true });
    else stage = m.state === 'idle' ? '<div class="bigmsg">準備搶答…</div>' : orderHTML(s, { big: true, judging: owner });
    // 教師模式：中間一整欄「學生答案」（是非／選擇＝王曉明 A；搶答＝還沒按的人），從頂端拉到底
    const liveOn = owner && tab === 'live' && showLive;
    const liveBody = m.state === 'idle' ? '<p class="muted center">按「開始作答／搶答」後這裡會即時顯示每位學生的答案</p>'
      : choice ? liveChipsHTML(s) : (notBuzzedHTML(s) || '<p class="muted center">所有學生都按過了</p>');
    const liveCol = liveOn ? `<section class="stage-live panel">
        <button class="btn sm live-hide" data-live-toggle title="投影給學生看時可先隱藏">🙈 隱藏</button>
        ${liveBody}${pendingBarHTML(s)}</section>` : '';
    const liveBtn = owner && tab === 'live' && !showLive
      ? '<button class="btn sm live-toggle" data-live-toggle>👁 顯示學生答案</button>' : '';

    patch(main, `
      <div class="game${liveOn ? ' with-live' : ''}">
        <section class="stage">
          <div class="stage-head">
            ${m.className ? `<span class="cls-tag">${esc(m.className)}</span>` : ''}
            <span class="q">第 ${esc(m.round)} 題</span>
            <span class="badge st-${m.state}">${qtypeLabel(m)}・${stateText(m)}</span>
            <span class="spacer" style="flex:1"></span>
            <span class="bigcd" data-cd></span>
          </div>
          <div class="tabs">
            <button class="btn sm ${tab === 'live' ? 'on' : ''}" data-tab="live">本題</button>
            <button class="btn sm ${tab === 'board' ? 'on' : ''}" data-tab="board">排行榜</button>
            ${liveBtn}
          </div>
          <div class="stage-body">
            <div class="stage-main">${stage}</div>
          </div>
        </section>
        ${liveCol}
        <aside class="side${owner ? ' owner' : ''}">
          ${owner ? `<div class="panel ctl-panel">${controlsHTML(s)}</div>` : ''}
          ${sideHTML()}
        </aside>
      </div>`);
  }
}
</script>
</body>
</html>
